services:
  backend:
    build: ./backend
    image: diagnostico-api:dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DIAGNOSTICO_APP_NAME: ${DIAGNOSTICO_APP_NAME:-diagnostico-api}
    restart: unless-stopped

